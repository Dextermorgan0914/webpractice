<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ToDo | Dexter Morgan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #141414;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    nav {
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #e50914;
      letter-spacing: 4px;
      text-decoration: none;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      padding: 0 40px;
    }

    .tag {
      color: #e50914;
      font-size: 13px;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 40px;
    }

    input {
      flex: 1;
      padding: 15px 20px;
      background-color: #1f1f1f;
      border: 1px solid #333;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #e50914;
    }

    input::placeholder {
      color: #555;
    }

    .btn-add {
      padding: 15px 25px;
      background-color: #e50914;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.3s;
    }

    .btn-add:hover {
      background-color: #f40612;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background-color: #1f1f1f;
      margin-bottom: 10px;
      border-left: 3px solid #e50914;
      transition: background 0.3s;
    }

    li:hover {
      background-color: #2a2a2a;
    }

    li.done {
      border-left-color: #444;
      opacity: 0.5;
    }

    li.done span {
      text-decoration: line-through;
    }

    .li-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #e50914;
    }

    .btn-delete {
      padding: 8px 15px;
      background: none;
      border: 1px solid #444;
      color: #888;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    .btn-delete:hover {
      border-color: #e50914;
      color: #e50914;
    }

    .back {
      display: inline-block;
      margin-top: 50px;
      padding: 15px 30px;
      border: 1px solid #e50914;
      color: #e50914;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 13px;
      transition: all 0.3s;
    }

    .back:hover {
      background-color: #e50914;
      color: white;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">DEXTER</a>
  </nav>

  <div class="container">
    <p class="tag">TASK MANAGER</p>
    <h1>ToDo List</h1>

    <div class="input-area">
      <input id="todoInput" type="text" placeholder="やることを入力...">
      <button class="btn-add" onclick="addTodo()">追加</button>
    </div>

    <ul id="todoList"></ul>

    <a href="index.html" class="back">← BACK</a>
  </div>

  <script>
    function addTodo() {
      let input = document.getElementById("todoInput").value;
      if (input === "") {
        alert("やることを入力してな！");
        return;
      }
      let list = document.getElementById("todoList");
      let item = document.createElement("li");

      let left = document.createElement("div");
      left.className = "li-left";

      let checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.onclick = function() {
        item.classList.toggle("done");
      };

      let text = document.createElement("span");
      text.textContent = input;

      left.appendChild(checkbox);
      left.appendChild(text);

      let deleteBtn = document.createElement("button");
      deleteBtn.textContent = "削除";
      deleteBtn.className = "btn-delete";
      deleteBtn.onclick = function() {
        list.removeChild(item);
      };

      item.appendChild(left);
      item.appendChild(deleteBtn);
      list.appendChild(item);
      document.getElementById("todoInput").value = "";
    }
  </script>

</body>
</html>
